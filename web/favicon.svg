<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- MaveScape: a small variant-effect map, positions across and substitutions down, colored
       from loss of function (blue) through wild type (light) to gain (coral). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#1f3a68"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g transform="translate(10 10)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#2a6fdb"/>
    <rect x="11" y="0" width="10" height="10" rx="2" fill="#9cc2f2"/>
    <rect x="22" y="0" width="10" height="10" rx="2" fill="#f2f4f7"/>
    <rect x="33" y="0" width="11" height="10" rx="2" fill="#f2b8a4"/>
    <rect x="0" y="11" width="10" height="10" rx="2" fill="#9cc2f2"/>
    <rect x="11" y="11" width="10" height="10" rx="2" fill="#2a6fdb"/>
    <rect x="22" y="11" width="10" height="10" rx="2" fill="#1d4f9c"/>
    <rect x="33" y="11" width="11" height="10" rx="2" fill="#f2f4f7"/>
    <rect x="0" y="22" width="10" height="10" rx="2" fill="#f2f4f7"/>
    <rect x="11" y="22" width="10" height="10" rx="2" fill="#9cc2f2"/>
    <rect x="22" y="22" width="10" height="10" rx="2" fill="#2a6fdb"/>
    <rect x="33" y="22" width="11" height="10" rx="2" fill="#e0603f"/>
    <rect x="0" y="33" width="10" height="11" rx="2" fill="#f2b8a4"/>
    <rect x="11" y="33" width="10" height="11" rx="2" fill="#f2f4f7"/>
    <rect x="22" y="33" width="10" height="11" rx="2" fill="#9cc2f2"/>
    <rect x="33" y="33" width="11" height="11" rx="2" fill="none" stroke="#f2f4f7" stroke-width="1.6" stroke-dasharray="2.4 2"/>
  </g>
</svg>
