[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mavescape"
version = "0.7.0"
description = "Remote control of a running MaveScape (multiplexed assays of variant effect) from Python"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Robert McDermott" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["deep mutational scanning", "multiplexed assays of variant effect", "MAVE", "MaveScape"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
pandas = ["pandas"]

[project.urls]
Homepage = "https://github.com/robert-mcdermott/MaveScape"
Documentation = "https://github.com/robert-mcdermott/MaveScape/tree/main/clients"

[tool.setuptools.packages.find]
where = ["src"]
