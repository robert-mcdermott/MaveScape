name: CI

# Once for each commit pushed, on any branch. A pull request shows its branch's checks, so it is
# tested again only when it comes from a fork; a merge whose files are its branch's, tested when the
# branch was pushed, tests nothing again (job `changed` decides both); and the release checks that
# CI passed on the files it tags instead of testing them a fourth time (release.yml). A newer push
# to the same branch cancels a run not yet finished. Not for a change of documentation alone: no
# check reads the Markdown files, the spec, the license or the citation (the site's pages and
# screenshots are checked, so docs/site and docs/images still run it). Actions' "Run workflow"
# button runs it all by hand. Every check here is on fixed data; the public services as they answer
# today are checked weekly instead (live.yml), so that one being down fails no commit.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'mavescape-spec/**'
      - 'LICENSE'
      - 'CITATION.cff'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'mavescape-spec/**'
      - 'LICENSE'
      - 'CITATION.cff'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    name: Anything new to test
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.decide.outputs.test }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          test=true
          if [ "$EVENT" = pull_request ] && [ "$FORK" != true ]; then
            echo "A branch of this repository: tested when it was pushed, its checks shown on the pull request."
            test=false
          elif [ "$EVENT" = push ] && git rev-parse -q --verify 'HEAD^2' > /dev/null && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            echo "A merge whose files are those of $(git rev-parse --short 'HEAD^2'), tested when it was pushed."
            test=false
          fi
          echo "test=$test" >> "$GITHUB_OUTPUT"

  go:
    name: Go host
    needs: changed
    if: needs.changed.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: Cross-compile
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .
          GOOS=darwin GOARCH=amd64 go build -o /dev/null .
          GOOS=linux GOARCH=amd64 go build -o /dev/null .
          GOOS=linux GOARCH=arm64 go build -o /dev/null .
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
          GOOS=windows GOARCH=arm64 go build -o /dev/null .

  web:
    name: Browser modules
    needs: changed
    if: needs.changed.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          shopt -s nullglob
          for file in web/app.js web/ui/*.js web/lib/*.js web/lib/providers/*.js web/lib/structure/*.js web/workers/*.js validation/*.mjs validation/fixtures/*.mjs docs/capture/*.mjs docs/site/*.mjs docs/site/assets/*.js; do node --check "$file"; done
      - name: node --test
        # The structure viewer's performance tests allow shared runners five times as long.
        env:
          MAVESCAPE_TIME_SCALE: 5
        run: node --test "web/lib/**/*.test.mjs"
      - name: Cache external validation data
        uses: actions/cache@v4
        with:
          path: validation/cache
          key: validation-data-${{ hashFiles('validation/sources.json') }}
      - name: Fetch external validation data
        run: node validation/fetch.mjs
      - name: Validation against reference values
        run: node validation/run.mjs --require-data
      - name: Coverage of 95% intervals (simulated, dms_variants, real data held out)
        run: node validation/coverage.mjs --verbose --require-data
      - name: Performance budgets (scoring, the map, a million-row import)
        run: node validation/bench.mjs
      - name: The website builds, with every link, anchor and screenshot
        run: node docs/site/build.mjs "$RUNNER_TEMP/site"

  remote:
    name: Remote control
    needs: changed
    if: needs.changed.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the MaveDB tables the session compares with Node (DHFR's two score sets, BAP1's, TP53's three, BRCA1 RING's certified, PTEN's calibration example) and axe-core (the review report's accessibility)
        uses: actions/cache@v4
        with:
          path: |
            validation/cache/mavedb-dhfr
            validation/cache/mavedb-bap1-sge
            validation/cache/mavedb-tp53-screens
            validation/cache/mavedb-brca1-ring
            validation/cache/mavedb-pten-vampseq
            validation/cache/axe-core
          key: validation-remote-${{ hashFiles('validation/sources.json') }}
      - name: Fetch those MaveDB tables and axe-core
        run: node validation/fetch.mjs mavedb-dhfr mavedb-bap1-sge mavedb-tp53-screens mavedb-brca1-ring mavedb-pten-vampseq axe-core
      - name: Every remote action, in the program and headless Chrome, against Node
        run: node validation/remote-session.mjs --verbose --require-data
        env:
          CHROME: /usr/bin/google-chrome
      - name: A million barcodes imported and scored in the window
        run: node validation/browser-bench.mjs
        env:
          CHROME: /usr/bin/google-chrome
      - name: mavescape run and validate, as a pipeline runs them
        run: node validation/headless-run.mjs --verbose
        env:
          CHROME: /usr/bin/google-chrome

  agents:
    name: AI agents (MCP)
    needs: changed
    if: needs.changed.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every tool through mavescape mcp on stdio, as an agent's client calls them, in headless Chrome
        run: node validation/agent-session.mjs --verbose
        env:
          CHROME: /usr/bin/google-chrome

  clients:
    name: R and Python clients
    needs: changed
    if: needs.changed.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: R and Python packages the tests and examples use
        run: |
          Rscript -e 'install.packages(c("curl", "jsonlite", "testthat"))'
          python -m pip install pandas matplotlib nbclient ipykernel
      - name: Cache DHFR's MaveDB tables (the R example)
        uses: actions/cache@v4
        with:
          path: validation/cache/mavedb-dhfr
          key: validation-clients-${{ hashFiles('validation/sources.json') }}
      - name: Fetch DHFR's MaveDB tables
        run: node validation/fetch.mjs mavedb-dhfr
      - name: The clients' functions match the actions, their versions MaveScape's
        run: node clients/generate.mjs --check
      - name: R CMD check
        run: |
          R CMD build clients/r
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual mavescape_*.tar.gz
      - name: Both clients against a running MaveScape, in headless Chrome, then the examples (the GRB2 notebook, the DHFR script)
        run: node clients/test-clients.mjs --require
        env:
          CHROME: /usr/bin/google-chrome
          PYTHON: python

  installers:
    name: Installer syntax
    needs: changed
    if: needs.changed.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
