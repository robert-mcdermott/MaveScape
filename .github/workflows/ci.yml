name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: Cross-compile
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .
          GOOS=darwin GOARCH=amd64 go build -o /dev/null .
          GOOS=linux GOARCH=amd64 go build -o /dev/null .
          GOOS=linux GOARCH=arm64 go build -o /dev/null .
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
          GOOS=windows GOARCH=arm64 go build -o /dev/null .

  web:
    name: Browser modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          shopt -s nullglob
          for file in web/app.js web/ui/*.js web/lib/*.js web/workers/*.js validation/*.mjs validation/fixtures/*.mjs docs/capture/*.mjs docs/site/*.mjs docs/site/assets/*.js; do node --check "$file"; done
      - name: node --test
        run: node --test "web/lib/*.test.mjs"
      - name: Cache external validation data
        uses: actions/cache@v4
        with:
          path: validation/cache
          key: validation-data-${{ hashFiles('validation/sources.json') }}
      - name: Fetch external validation data
        run: node validation/fetch.mjs
      - name: Validation against reference values
        run: node validation/run.mjs --require-data
      - name: Performance budgets (scoring, the map, a million-row import)
        run: node validation/bench.mjs
      - name: The website builds, with every link, anchor and screenshot
        run: node docs/site/build.mjs "$RUNNER_TEMP/site"

  remote:
    name: Remote control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every remote action, in the program and headless Chrome, against Node
        run: node validation/remote-session.mjs --verbose
        env:
          CHROME: /usr/bin/google-chrome
      - name: A million barcodes imported and scored in the window
        run: node validation/browser-bench.mjs
        env:
          CHROME: /usr/bin/google-chrome

  installers:
    name: Installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
