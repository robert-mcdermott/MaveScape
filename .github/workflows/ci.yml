name: CI

# Not for a change of documentation alone: no check reads the Markdown files, the spec, the
# license or the citation (the site's pages and screenshots are checked, so docs/site and
# docs/images still run it). A push or pull request that changes anything else runs it all;
# Actions' "Run workflow" button runs it by hand.
on:
  push:
    # A wave's branch too, so each slice meets the runner as it is built, not at the release.
    branches: [main, 'wave*']
    paths-ignore:
      - '**.md'
      - 'mavescape-spec/**'
      - 'LICENSE'
      - 'CITATION.cff'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'mavescape-spec/**'
      - 'LICENSE'
      - 'CITATION.cff'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: Cross-compile
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .
          GOOS=darwin GOARCH=amd64 go build -o /dev/null .
          GOOS=linux GOARCH=amd64 go build -o /dev/null .
          GOOS=linux GOARCH=arm64 go build -o /dev/null .
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
          GOOS=windows GOARCH=arm64 go build -o /dev/null .

  web:
    name: Browser modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          shopt -s nullglob
          for file in web/app.js web/ui/*.js web/lib/*.js web/lib/providers/*.js web/lib/structure/*.js web/workers/*.js validation/*.mjs validation/fixtures/*.mjs docs/capture/*.mjs docs/site/*.mjs docs/site/assets/*.js; do node --check "$file"; done
      - name: node --test
        # The structure viewer's performance tests allow shared runners five times as long.
        env:
          MAVESCAPE_TIME_SCALE: 5
        run: node --test "web/lib/**/*.test.mjs"
      - name: Cache external validation data
        uses: actions/cache@v4
        with:
          path: validation/cache
          key: validation-data-${{ hashFiles('validation/sources.json') }}
      - name: Fetch external validation data
        run: node validation/fetch.mjs
      - name: Validation against reference values
        run: node validation/run.mjs --require-data
      - name: Coverage of 95% intervals (simulated, dms_variants, real data held out)
        run: node validation/coverage.mjs --verbose --require-data
      - name: Performance budgets (scoring, the map, a million-row import)
        run: node validation/bench.mjs
      - name: The website builds, with every link, anchor and screenshot
        run: node docs/site/build.mjs "$RUNNER_TEMP/site"

  remote:
    name: Remote control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the MaveDB tables the session compares with Node (DHFR's two score sets, BAP1's, TP53's three)
        uses: actions/cache@v4
        with:
          path: |
            validation/cache/mavedb-dhfr
            validation/cache/mavedb-bap1-sge
            validation/cache/mavedb-tp53-screens
          key: validation-remote-${{ hashFiles('validation/sources.json') }}
      - name: Fetch those MaveDB tables
        run: node validation/fetch.mjs mavedb-dhfr mavedb-bap1-sge mavedb-tp53-screens
      - name: Every remote action, in the program and headless Chrome, against Node
        run: node validation/remote-session.mjs --verbose --require-data
        env:
          CHROME: /usr/bin/google-chrome
      - name: A million barcodes imported and scored in the window
        run: node validation/browser-bench.mjs
        env:
          CHROME: /usr/bin/google-chrome
      - name: mavescape run and validate, as a pipeline runs them
        run: node validation/headless-run.mjs --verbose
        env:
          CHROME: /usr/bin/google-chrome
      - name: The feasibility records opened from MaveDB, live, and the phase-0 exit checked again
        run: node validation/mavedb-live.mjs --verbose
        env:
          CHROME: /usr/bin/google-chrome

  installers:
    name: Installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
